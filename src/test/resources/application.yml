spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;NON_KEYWORDS=KEY
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate.format_sql: false
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-for-junit-tests-only-min-32-chars
  expiration-ms: 86400000

mercadopago:
  access-token: test-token
  public-key: test-public-key
  app-id: test-app-id
  app-secret: test-app-secret

app:
  db-password: test
  frontend-url: http://localhost:3000
  email-enabled: false
